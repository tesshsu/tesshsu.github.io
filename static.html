<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yating Chatiron - Visitor Statistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="bg-white text-black">
    <!-- Sidebar Placeholder -->
    <div id="sidebar-container"></div>
    <main class="container mx-auto px-4 py-10 pl-20">
        <div class="space-y-6">
            <div class="border-b pb-6">
                <h1 class="blog-title text-2xl font-semibold mb-2">📊 Statistiques des Visiteurs</h1>
                <p class="text-gray-600 mb-2">07 Mai 2025</p>
                <p class="sub-title text-lg">
                    Statistiques des visiteurs pour la période du 07/05/2025.
                </p>

                <!-- Pages Section -->
                <div class="mt-6">
                    <h2 class="text-lg font-semibold mb-2">Pages</h2>
                    <div id="pages-stats" class="space-y-2">
                        <!-- Pages will be populated by JavaScript -->
                    </div>
                    <div class="mt-2 font-semibold">
                        Total: <span id="total-visits"></span> visites
                    </div>
                </div>

                <!-- Top Referrers Section -->
                <div class="mt-6">
                    <h2 class="text-lg font-semibold mb-2">Top Referrers</h2>
                    <div id="referrers-stats" class="space-y-2">
                        <!-- Referrers will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Browsers Section -->
                <div class="mt-6">
                    <h2 class="text-lg font-semibold mb-2">Browsers</h2>
                    <div id="browsers-stats" class="space-y-2">
                        <!-- Browsers will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Systems Section -->
                <div class="mt-6">
                    <h2 class="text-lg font-semibold mb-2">Systems</h2>
                    <div id="systems-stats" class="space-y-2">
                        <!-- Systems will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Block -->
        <div class="mt-6 p-4 bg-gray-100 rounded-lg flex justify-between">
            <a href="/blog.html" class="text-blue-600 hover:underline">← Retour aux blogs</a>
            <a href="/fr.html" class="text-blue-600 hover:underline">Retour au site →</a>
        </div>
    </main>

    <!-- Load GoatCounter stats and populate sections -->
    <script src="./assets/js/stats.js"></script>
    <script>
        // Populate Pages
        const pagesContainer = document.getElementById('pages-stats');
        goatCounterStats.pages.forEach(page => {
            const div = document.createElement('div');
            div.className = 'flex justify-between items-center border-b pb-1';
            div.innerHTML = `
                <span>${page.count} ${page.path}</span>
                <div class="w-1/3 h-2 bg-pink-200 rounded">
                    <div class="h-2 bg-purple-500 rounded" style="width: ${(page.count / goatCounterStats.total * 100)}%"></div>
                </div>
            `;
            pagesContainer.appendChild(div);
        });

        // Populate Total Visits
        document.getElementById('total-visits').textContent = goatCounterStats.total;

        // Populate Referrers
        const referrersContainer = document.getElementById('referrers-stats');
        goatCounterStats.referrers.forEach(referrer => {
            const div = document.createElement('div');
            div.className = 'flex justify-between items-center border-b pb-1';
            div.innerHTML = `
                <span>${referrer.percentage}% ${referrer.name}</span>
                <div class="w-1/3 h-2 bg-pink-200 rounded">
                    <div class="h-2 bg-pink-400 rounded" style="width: ${referrer.percentage}%"></div>
                </div>
            `;
            referrersContainer.appendChild(div);
        });

        // Populate Browsers
        const browsersContainer = document.getElementById('browsers-stats');
        goatCounterStats.browsers.forEach(browser => {
            if (browser.percentage > 0) { // Only show browsers with visits
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center border-b pb-1';
                div.innerHTML = `
                    <span>${browser.percentage}% ${browser.name}</span>
                    <div class="w-1/3 h-2 bg-pink-200 rounded">
                        <div class="h-2 bg-pink-400 rounded" style="width: ${browser.percentage}%"></div>
                    </div>
                `;
                browsersContainer.appendChild(div);
            }
        });

        // Populate Systems
        const systemsContainer = document.getElementById('systems-stats');
        goatCounterStats.systems.forEach(system => {
            if (system.percentage > 0) { // Only show systems with visits
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center border-b pb-1';
                div.innerHTML = `
                    <span>${system.count} ${system.percentage}% ${system.name}</span>
                    <div class="w-1/3 h-2 bg-pink-200 rounded">
                        <div class="h-2 bg-pink-400 rounded" style="width: ${system.percentage}%"></div>
                    </div>
                `;
                systemsContainer.appendChild(div);
            }
        });
    </script>
    <script src="./assets/js/script.js"></script>
</body>
</html>
