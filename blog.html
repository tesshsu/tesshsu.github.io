<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yating Chatiron - Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>
<body class="bg-white text-black flex">
    <!-- Left Sidebar -->
    <aside class="fixed top-0 left-0 h-full w-16 bg-gray-800 text-white flex flex-col items-center py-4">
        <div class="mb-8">
            <i class="fas fa-user text-2xl"></i>
        </div>
        <nav class="flex flex-col space-y-4">
            <a href="fr.html#about" class="hover:text-gray-400"><i class="fas fa-info-circle text-xl"></i></a>
            <a href="fr.html#experience" class="hover:text-gray-400"><i class="fas fa-briefcase text-xl"></i></a>
            <a href="fr.html#certificates" class="hover:text-gray-400"><i class="fas fa-certificate text-xl"></i></a>
            <a href="fr.html#skills" class="hover:text-gray-400"><i class="fas fa-tools text-xl"></i></a>
            <a href="blog.html" class="hover:text-gray-400"><i class="fas fa-blog text-xl"></i></a>
        </nav>
        <!-- Social Media Links -->
        <div class="flex flex-col space-y-4 mt-4">
            <a href="https://github.com/tesshsu" target="_blank" class="hover:text-gray-400"><i class="fab fa-github text-xl"></i></a>
            <a href="https://www.linkedin.com/in/yating-hsu-a9b1a221/" target="_blank" class="hover:text-gray-400  <div class="mt-auto">
            <select id="language-switcher" class="bg-gray-800 text-white border-none outline-none">
                <option value="en">EN</option>
                <option value="fr" selected>FR</option>
            </select>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-16 flex-1">
        <!-- Navbar -->
        <nav class="fixed top-0 w-full bg-white shadow-md p-4 z-10">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold">Yating Chatiron</h1>
                <div class="hidden md:flex space-x-4">
                    <a href="fr.html#about" class="hover:text-gray-600">À propos</a>
                    <a href="fr.html#experience" class="hover:text-gray-600">Expérience</a>
                    <a href="fr.html#certificates" class="hover:text-gray-600">Certificats</a>
                    <a href="fr.html#skills" class="hover:text-gray-600">Compétences</a>
                    <a href="blog.html" class="hover:text-gray-600">Blog</a>
                </div>
            </div>
        </nav>

        <!-- Blog Section -->
        <section id="blog" class="pt-20 pb-10 mt-4">
            <div class="container mx-auto px-4">
                <div id="blog-posts" class="space-y-6">
                    <!-- Blog posts will be loaded here dynamically -->
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="py-4 bg-black text-white text-center">
            <p>© 2025 Yating Chatiron. Tous droits réservés.</p>
        </footer>
    </main>

    <!-- Scripts -->
    <script>
        // Language Switcher
        document.getElementById('language-switcher').addEventListener('change', function() {
            const lang = this.value;
            if (lang === 'en') {
                window.location.href = 'index.html';
            } else if (lang === 'fr') {
                window.location.href = 'fr.html';
            }
        });

        // Load blog posts dynamically in descending order
        async function loadBlogPosts() {
            const blogContainer = document.getElementById('blog-posts');
            const blogFiles = [];
            const maxBlogs = 3; // Adjust this number based on the maximum number of blogs you expect

            // Dynamically generate blog file names (blogs/blog-1.html, blogs/blog-2.html, etc.)
            for (let i = 1; i <= maxBlogs; i++) {
                blogFiles.push(`blogs/blog-${i}.html`);
            }

            // Sort blog files in descending order based on the numerical part of the filename
            blogFiles.sort((a, b) => {
                const numA = parseInt(a.match(/blog-(\d+)\.html/)[1]);
                const numB = parseInt(b.match(/blog-(\d+)\.html/)[1]);
                return numB - numA; // Descending order
            });

            for (const file of blogFiles) {
                try {
                    const response = await fetch(file);
                    if (response.ok) {
                        const content = await response.text();
                        const div = document.createElement('div');
                        div.innerHTML = content;
                        blogContainer.appendChild(div);
                    } else {
                        console.log(`No more blog posts found after ${file}`);
                        break; // Stop loading when a file is not found
                    }
                } catch (error) {
                    console.error(`Error loading ${file}:`, error);
                    break; // Stop on error
                }
            }
        }

        // Load blogs when the page loads
        window.addEventListener('DOMContentLoaded', loadBlogPosts);
    </script>
</body>
</html>
