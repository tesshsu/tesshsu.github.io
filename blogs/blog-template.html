<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yating Chatiron - BLOG_TITLE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script src="../assets/js/blog.js" defer></script>
</head>
<body class="bg-white text-black flex flex-col min-h-screen">
  <!-- Sidebar Placeholder — loaded dynamically by script.js -->
  <div id="sidebar-container" class="fixed top-0 left-0 h-full w-16 bg-gray-800 text-white z-20"></div>

  <main role="main" class="flex-1 ml-16">
    <article class="container mx-auto px-4 py-10">

      <!-- ============================================================
           BLOG HEADER — update title, date, category, image, subtitle
           ============================================================ -->
      <header class="border-b pb-6 mb-6">
        <h1 class="blog-title text-2xl font-semibold mb-2">BLOG TITLE HERE</h1>
        <div class="flex items-center mb-4">
          <p class="text-gray-600 mr-4">DATE HERE</p>
          <span class="category bg-blue-100 text-blue-800 text-sm font-medium px-2.5 py-0.5 rounded">CATEGORY</span>
        </div>
        <img src="../img/blog/blog-N.jpeg" alt="Blog image" class="w-full max-w-3xl mx-auto h-auto object-cover mb-6 rounded shadow" loading="lazy">
        <p class="sub-title text-lg">SUBTITLE HERE</p>
      </header>

      <!-- ============================================================
           BLOG CONTENT — write your sections here
           ============================================================ -->
      <section class="space-y-4 text-lg">

      </section>

      <!-- Share buttons + navigation injected automatically by
           loadBlogArticleFooter() in blog.js (assets/partials/blog-article-footer.html) -->

    </article>
  </main>

  <!-- Footer is injected dynamically by script.js loadFooter() from assets/partials/footer.html -->
  <script src="../assets/js/script.js" defer></script>
</body>
</html>
